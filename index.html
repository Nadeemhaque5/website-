<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium PDF Editor</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="pdf-editor-container">
        <header class="editor-header">
            <div class="logo-container">
                <i class="fas fa-file-pdf logo-icon"></i>
                <h1 class="editor-title">Premium PDF Editor</h1>
            </div>
            <div class="main-actions">
                <button id="loadPdfBtn" class="action-btn" title="Load PDF">
                    <i class="fas fa-folder-open"></i> Load PDF
                </button>
                <input type="file" id="pdfFileInput" accept=".pdf" style="display: none;">
                <button id="savePdfBtn" class="action-btn" title="Save PDF">
                    <i class="fas fa-save"></i> Save PDF
                </button>
            </div>
        </header>
        <main class="editor-main">
            <aside class="toolbar-container">
                <h2>Tools</h2>
                <div class="toolbar">
                    <button class="tool-btn" data-tool="select" title="Select"><i class="fas fa-mouse-pointer"></i></button>
                    <button class="tool-btn" data-tool="text" title="Add Text"><i class="fas fa-font"></i></button>
                    <button class="tool-btn" data-tool="image" title="Add Image"><i class="fas fa-image"></i></button>
                    <button class="tool-btn" data-tool="draw" title="Draw"><i class="fas fa-pencil-alt"></i></button>
                    <button class="tool-btn" data-tool="rectangle" title="Add Rectangle"><i class="far fa-square"></i></button>
                </div>
                <div id="tool-properties" class="tool-properties">
                    <div id="text-properties" class="properties-panel hidden">
                        <h4>Text Properties</h4>
                        <div class="property">
                            <label for="font-size-input">Font Size:</label>
                            <input type="number" id="font-size-input" value="24" min="1">
                        </div>
                        <div class="property">
                            <label for="color-input">Color:</label>
                            <input type="color" id="color-input" value="#000000">
                        </div>
                    </div>
                    <!-- Other tool properties will go here -->
                </div>
            </aside>
            <section class="pdf-viewer-area">
                <div id="pdf-viewer">
                    <!-- PDF pages will be rendered here as canvases -->
                </div>
            </section>
            <aside class="pages-container">
                <h2>Pages</h2>
                <div id="pages-thumbnails">
                    <!-- Page thumbnails will be shown here -->
                </div>
            </aside>
        </main>
    </div>
    <script src="https://unpkg.com/pdf-lib/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.11.338/pdf.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
